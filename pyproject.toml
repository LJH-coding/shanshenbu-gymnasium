[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "shanshenbu-gym"
version = "0.1.0"
description = "Headless Gymnasium environments for Shanshenbu battles"
readme = "README.md"
requires-python = ">=3.10"
dependencies = ["gymnasium>=1.0,<2", "numpy>=1.22"]

[tool.setuptools]
packages = ["shanshenbu_gym", "shanshenbu_gym.js", "shanshenbu_gym.models"]

[tool.setuptools.package-dir]
"shanshenbu_gym.models" = "assets/ai"

[tool.setuptools.package-data]
"shanshenbu_gym.js" = ["*.cjs", "*.js"]
"shanshenbu_gym.models" = ["base3_weak.json", "base3_medium.json"]
